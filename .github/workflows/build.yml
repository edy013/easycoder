# Automatyczna budowa EASY CODER dla Windows i macOS z jednego repozytorium.
# Uruchamia się przy tagu v* (np. v1.0.0) – wtedy tworzy też Release – albo ręcznie.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-build.txt
      - run: choco install innosetup -y --no-progress
      - run: powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: EasyCoder-Windows
          path: |
            dist/EasyCoder-win-x64.zip
            dist/EasyCoder-Setup.exe

  macos:
    needs: test
    strategy:
      matrix:
        include:
          - { runner: macos-14, arch: arm64 }         # Apple Silicon M1–M4
          - { runner: macos-15-intel, arch: x86_64 }  # Intel
    runs-on: ${{ matrix.runner }}
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-build.txt
      # Opcjonalny podpis/notaryzacja – ustaw sekrety repozytorium, inaczej podpis ad-hoc.
      - name: Import certyfikatu (opcjonalnie)
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: Profil notaryzacji (opcjonalnie)
        if: env.HAS_NOTARY == 'true'
        run: |
          xcrun notarytool store-credentials easycoder --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}"
      - run: bash scripts/build_macos.sh ${{ matrix.arch }}
        env:
          EC_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          EC_NOTARY_PROFILE: ${{ env.HAS_NOTARY == 'true' && 'easycoder' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: EasyCoder-macOS-${{ matrix.arch }}
          path: dist/EasyCoder-macOS-${{ matrix.arch }}.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
